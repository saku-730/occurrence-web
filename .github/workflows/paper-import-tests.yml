name: Paper Import Tests

# TDD safety net for the paper-import backend flow.
on:
  push:
    branches:
      - feature-paper-import
    paths:
      - "backend/**"
      - "postgreSQL/migrations/**"
      - "compose.yaml"
      - ".github/workflows/paper-import-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "postgreSQL/migrations/**"
      - "compose.yaml"
      - ".github/workflows/paper-import-tests.yml"
  workflow_dispatch:

jobs:
  paper-import-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: occurrence_password
          POSTGRES_DB: occurrence_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d occurrence_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://admin:occurrence_password@127.0.0.1:5432/occurrence_web_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Compile and pure unit tests first so code errors fail fast without waiting for DB tooling.
      - name: Check all Rust targets
        working-directory: backend
        run: cargo check --all-targets

      - name: Run GROBID parser unit tests
        working-directory: backend
        run: cargo test grobid::tests --lib -- --test-threads=1

      - name: Run paper import service unit tests
        working-directory: backend
        run: cargo test features::paper_import::service::tests --lib -- --test-threads=1

      - name: Run GROBID HTTP error mapping tests
        working-directory: backend
        run: cargo test --test paper_import_grobid_http -- --test-threads=1

      - name: Set up Go for goose
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1

      - name: Apply PostgreSQL migrations
        run: goose -dir postgreSQL/migrations postgres "$DATABASE_URL" up

      - name: Run paper import service integration tests
        working-directory: backend
        run: cargo test --test paper_import_flow -- --test-threads=1

      - name: Run staged PDF extraction bridge tests
        working-directory: backend
        run: cargo test --test paper_import_extraction_bridge -- --test-threads=1

      - name: Run paper import HTTP integration tests
        working-directory: backend
        run: cargo test --test paper_import_http -- --test-threads=1

      - name: Run paper import HTTP error-path tests
        working-directory: backend
        run: cargo test --test paper_import_http_errors -- --test-threads=1

      - name: Run paper import MIME normalization regression test
        working-directory: backend
        run: cargo test --test paper_import_content_type -- --test-threads=1

  real-grobid-smoke:
    runs-on: ubuntu-latest
    env:
      GROBID_BASE_URL: http://127.0.0.1:8070

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start real GROBID 0.9.1 CRF server
        run: >-
          docker run -d
          --name occurrence-grobid-ci
          --init
          --ulimit core=0
          -p 8070:8070
          grobid/grobid:0.9.1-crf

      - name: Wait for GROBID server
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8070/api/version; then
              exit 0
            fi
            sleep 2
          done
          docker logs occurrence-grobid-ci
          exit 1

      - name: Run real GROBID PDF smoke test
        working-directory: backend
        run: cargo test --test paper_import_real_grobid -- --ignored --nocapture --test-threads=1

      - name: Show GROBID logs on failure
        if: failure()
        run: docker logs occurrence-grobid-ci

      - name: Stop GROBID
        if: always()
        run: docker rm -f occurrence-grobid-ci || true
