name: Fix package-lock conflict

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-package-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package-lock conflict
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/package-lock.json")
          text = path.read_text()
          pattern = re.compile(
              r'<<<<<<< HEAD\n'
              r'\s*"markdown-to-jsx": "9\.10\.2",\n'
              r'=======\n'
              r'\s*"html2canvas": "\^1\.4\.1",\n'
              r'\s*"jspdf": "\^4\.2\.1",\n'
              r'>>>>>>> origin/main\n'
          )
          replacement = (
              '        "html2canvas": "^1.4.1",\n'
              '        "jspdf": "^4.2.1",\n'
              '        "markdown-to-jsx": "9.10.2",\n'
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one conflict block, found {count}")
          path.write_text(updated)
          PY

      - name: Validate JSON
        run: python -m json.tool frontend/package-lock.json > /dev/null

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix package-lock.json merge conflict"
          git push
